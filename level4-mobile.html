<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>DC17 Temps</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#12161d; --panel-2:#1a1f28; --line:#262d38;
    --ink:#e8edf4; --ink-dim:#8b94a3; --accent:#37b0ff;
    --ok:#4fd08a; --warn:#ffcf5c; --alarm:#ff5c5c;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{padding-bottom:30px}
  header{position:sticky;top:0;z-index:20;background:rgba(11,14,19,.94);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:13px 14px 10px}
  .htop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:16px;font-weight:600}
  .hright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .status{font-family:var(--mono);font-size:10px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
  .status .live{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 8px var(--ok);animation:blink 2s infinite}
  @keyframes blink{50%{opacity:.35}}
  .desklink{text-decoration:none;font-family:var(--mono);font-size:10px;color:var(--ink-dim);
    border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:var(--panel-2)}
  .floortabs{display:flex;gap:6px;margin-top:11px;overflow-x:auto;padding-bottom:2px}
  .ftab{flex:none;font-size:13px;font-weight:600;color:var(--ink-dim);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
  .ftab.active{background:var(--accent);color:#04121d;border-color:var(--accent)}
  .subtoggle{display:flex;gap:4px;margin-top:10px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;padding:4px}
  .subtoggle button{flex:1;font-size:13px;font-weight:600;color:var(--ink-dim);
    background:transparent;border:none;border-radius:7px;padding:8px 0;cursor:pointer}
  .subtoggle button.active{background:var(--accent);color:#04121d}

  main{padding:14px 14px 0}
  .section-label{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ink-dim);margin:16px 2px 9px}
  .section-label:first-child{margin-top:2px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;margin-bottom:10px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--warn)}
  .card.ok::before{background:var(--ok)} .card.alarm::before{background:var(--alarm)}
  .ctop{display:flex;align-items:center;gap:9px}
  .cdot{width:11px;height:11px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 7px currentColor}
  .card.ok .cdot{background:var(--ok);color:var(--ok)} .card.alarm .cdot{background:var(--alarm);color:var(--alarm)}
  .cname{font-size:15px;font-weight:600}
  .cpill{margin-left:auto;font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:5px;
    border:1px solid var(--line);color:var(--ink-dim)}
  .cpill.live{color:var(--ok);border-color:#24463a} .cpill.alarm{color:var(--alarm);border-color:#5a2a2a}
  .cbig{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px;line-height:1}
  .cbig span{font-size:16px;font-weight:600;color:var(--ink-dim);margin-left:3px}
  .cbig.alarm{color:var(--alarm)} .cbig.warn{color:var(--warn)}
  .csub{font-size:13px;color:var(--ink-dim)} .csub b{color:var(--ink);font-weight:600}
  .cloc{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-dim);margin-top:7px;opacity:.75}
  .card.mini .cbig{display:none} .card.mini .cnote{font-size:13px;color:var(--ink-dim);margin-top:3px}
  .cempty{color:var(--ink-dim);font-size:13px;padding:6px 2px}

  .maphint{font-size:12px;color:var(--ink-dim);text-align:center;margin:2px 0 10px}
  .mapwrap{border:1px solid var(--line);border-radius:14px;overflow:auto;background:#0c0f14;
    max-height:74vh;-webkit-overflow-scrolling:touch}
  .mfloor{position:relative;width:200%;background-size:contain;background-repeat:no-repeat}
  .mdot{position:absolute;transform:translate(-50%,-50%);width:4.2%;aspect-ratio:1;border-radius:50%;
    border:2px solid rgba(255,255,255,.9);background:var(--warn);box-shadow:0 0 6px rgba(0,0,0,.5)}
  .mapzoom{display:flex;gap:8px;justify-content:center;margin-top:10px}
  .mapzoom button{font-family:var(--mono);font-size:16px;width:44px;height:38px;background:var(--panel-2);
    color:var(--ink);border:1px solid var(--line);border-radius:9px;cursor:pointer}
  .foot{text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-dim);opacity:.6;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
  <header>
    <div class="htop">
      <h1 id="h1">DC17 Temps</h1>
      <div class="hright">
        <div class="status"><span class="live" id="livedot"></span><span id="status">loading…</span></div>
        <a class="desklink" href="index.html">&#9974; Desktop</a>
      </div>
    </div>
    <div class="floortabs" id="floortabs"></div>
    <div class="subtoggle" id="subtoggle" style="display:none">
      <button id="st-read" class="active" onclick="setSub('read')">Readings</button>
      <button id="st-map" onclick="setSub('map')">Map</button>
    </div>
  </header>
  <main id="main"></main>

<script>
const APP = {"PROXY_URL": "https://licor-proxy.devinmorell.workers.dev/", "REFRESH_MS": 120000, "LOOKBACK_MIN": 1440, "FLOORS": [{"id": "L4", "name": "Level 4", "image": "floor4.png", "w": 1901, "h": 3406, "stationSn": "22459340", "nodes": [{"id": "4033", "name": "Elec Room S", "loc": "Electrical Room S", "top": 17.5, "left": 73.8, "sn": "22577742", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4032", "name": "Elec Room T", "loc": "Electrical Room T", "top": 26.8, "left": 73.9, "sn": "22577741", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4031", "name": "Elec Room U", "loc": "Electrical Room U", "top": 36.1, "left": 73.9, "sn": "22577740", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4029", "name": "Elec Room V", "loc": "Electrical Room V", "top": 45.3, "left": 73.9, "sn": "22577739", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4028", "name": "Elec Room W", "loc": "Electrical Room W", "top": 54.5, "left": 74.0, "sn": "22443485", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4027", "name": "Elec Room X", "loc": "Electrical Room X", "top": 63.6, "left": 74.0, "sn": "22443487", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4026", "name": "Elec Room R1", "loc": "Electrical Room R1", "top": 72.7, "left": 73.9, "sn": "22443486", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "EH-3", "name": "Ehouse 3", "loc": "Ehouse 3", "top": 27.1, "left": 94.3, "sn": "", "measurement": "Temperature", "warnF": 80, "alarmF": 90}, {"id": "EH-2", "name": "Ehouse 2", "loc": "Ehouse 2", "top": 36.3, "left": 94.1, "sn": "", "measurement": "Temperature", "warnF": 80, "alarmF": 90}, {"id": "EH-1", "name": "Ehouse 1", "loc": "Ehouse 1", "top": 46.3, "left": 94.2, "sn": "", "measurement": "Temperature", "warnF": 80, "alarmF": 90}, {"id": "4030", "name": "Data Hall 4-F", "loc": "Data Hall \u00b7 Aisle 4-F", "top": 33.8, "left": 33.1, "sn": "22577743", "measurement": "Temperature", "warnF": 80, "alarmF": 97}, {"id": "4020", "name": "Data Hall 4-C", "loc": "Data Hall \u00b7 Aisle 4-C", "top": 61.0, "left": 11.5, "sn": "22577738", "measurement": "Temperature", "warnF": 80, "alarmF": 97}]}, {"id": "L3", "name": "Level 3", "image": "floor3.png", "w": 1901, "h": 3406, "stationSn": "22459340", "nodes": [{"id": "3033", "name": "Elec Room Q", "loc": "Electrical Room Q", "top": 17.5, "left": 73.8, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3032", "name": "Elec Room R2", "loc": "Electrical Room R2", "top": 26.8, "left": 73.9, "sn": "22577744", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3031", "name": "Elec Room P", "loc": "Electrical Room P", "top": 36.1, "left": 73.9, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3029", "name": "Elec Room N", "loc": "Electrical Room N", "top": 45.3, "left": 73.9, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3028", "name": "Elec Room M", "loc": "Electrical Room M", "top": 54.5, "left": 74.0, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3027", "name": "Elec Room L", "loc": "Electrical Room L", "top": 63.6, "left": 74.0, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3026", "name": "Elec Room K", "loc": "Electrical Room K", "top": 72.7, "left": 73.9, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3030", "name": "Data Hall 3-F", "loc": "Data Hall \u00b7 Aisle 3-F", "top": 33.8, "left": 33.1, "sn": "", "measurement": "Temperature", "warnF": 80, "alarmF": 97}, {"id": "3020", "name": "Data Hall 3-C", "loc": "Data Hall \u00b7 Aisle 3-C", "top": 61.0, "left": 11.5, "sn": "", "measurement": "Temperature", "warnF": 80, "alarmF": 97}]}]};

function utcStamp(d){ return d.toISOString().slice(0,19).replace("T"," "); }
function parseTs(t){ return new Date(String(t).replace(" ","T")); }
function relTime(d){ const s=Math.round((Date.now()-d.getTime())/1000);
  if(s<60)return"just now"; if(s<3600)return Math.round(s/60)+" min ago"; return Math.round(s/3600)+" h ago"; }
function pickLatest(rows, sn, meas){ const want=(meas||"Temperature").toLowerCase();
  const m=rows.filter(r=>String(r.sensor_sn||"").split("-")[0]===String(sn)&&String(r.sensor_measurement_type||"").toLowerCase()===want);
  if(!m.length)return null; m.sort((a,b)=>parseTs(b.timestamp)-parseTs(a.timestamp));
  const r=m[0]; return {value:Number(r.value),unit:r.unit||"",ts:parseTs(r.timestamp)}; }
function toF(r){ const u=(r.unit||"").toUpperCase(); return (u.includes("C")&&!u.includes("F"))?r.value*9/5+32:r.value; }
function isLive(n){ return !!(n.sn&&String(n.sn).trim()); }

const floorById={}; APP.FLOORS.forEach(f=>floorById[f.id]=f);
let current="ALL", sub="read";

function buildTabs(){
  let h='<div class="ftab" data-f="ALL" onclick="selFloor(\'ALL\')">All Floors</div>';
  APP.FLOORS.forEach(f=> h+='<div class="ftab" data-f="'+f.id+'" onclick="selFloor(\''+f.id+'\')">'+f.name+'</div>');
  document.getElementById("floortabs").innerHTML=h; markTabs();
}
function markTabs(){ document.querySelectorAll(".ftab").forEach(el=>el.classList.toggle("active",el.dataset.f===current)); }
function selFloor(id){ current=id; sub="read"; markTabs();
  document.getElementById("subtoggle").style.display = id==="ALL"?"none":"flex";
  document.getElementById("st-read").classList.add("active"); document.getElementById("st-map").classList.remove("active");
  render(); }
function setSub(v){ sub=v; document.getElementById("st-read").classList.toggle("active",v==="read");
  document.getElementById("st-map").classList.toggle("active",v==="map"); render(); }

function cardLive(n){
  const cls=(n.reading&&n.reading.ok)?(n.state==="alarm"?"alarm":(n.state==="warn"?"warn":"ok")):"";
  let big,subL,pill;
  if(n.reading&&n.reading.ok){
    big='<div class="cbig '+(cls==="ok"?"":cls)+'">'+n.reading.temp.toFixed(1)+'<span>°F</span></div>';
    subL='<div class="csub">Humidity <b>'+(n.reading.rh!=null?n.reading.rh.toFixed(0)+'%RH':'—')+'</b> · updated '+relTime(n.reading.ts)+'</div>';
    pill=n.state==="alarm"?'<span class="cpill alarm">ALARM</span>':'<span class="cpill live">LIVE</span>';
  }else{ big='<div class="cbig" style="color:var(--ink-dim)">—</div>';
    subL='<div class="csub">'+((n.reading&&n.reading.msg)||'Waiting for data…')+'</div>'; pill='<span class="cpill">—</span>'; }
  return '<div class="card '+cls+'"><div class="ctop"><span class="cdot"></span><span class="cname">'+n.name+'</span>'+pill+'</div>'
    +big+subL+'<div class="cloc">'+n.loc+'</div></div>';
}
function cardRest(n){ return '<div class="card mini"><div class="ctop"><span class="cdot"></span><span class="cname">'+n.name
  +'</span><span class="cpill">'+n.id+'</span></div><div class="cnote">No sensor assigned</div><div class="cloc">'+n.loc+'</div></div>'; }

function render(){
  const main=document.getElementById("main");
  if(current==="ALL"){
    document.getElementById("h1").textContent="All Floors";
    let h="";
    APP.FLOORS.forEach(f=>{ const live=f.nodes.filter(isLive);
      h+='<div class="section-label">'+f.name+' · '+live.length+' sensors</div>';
      h+= live.length ? live.map(cardLive).join("") : '<div class="cempty">No sensors configured.</div>';
    });
    main.innerHTML=h; return;
  }
  const f=floorById[current];
  document.getElementById("h1").textContent=f.name;
  if(sub==="map"){
    main.innerHTML='<div class="maphint">Pinch or use +/− to zoom · tap a dot for its card</div>'
      +'<div class="mapwrap"><div class="mfloor" id="mfloor"></div></div>'
      +'<div class="mapzoom"><button onclick="zoomMap(-1)">−</button><button onclick="zoomMap(1)">+</button></div>';
    const mf=document.getElementById("mfloor");
    mf.style.aspectRatio=f.w+" / "+f.h; mf.style.backgroundImage="url('"+f.image+"')"; mf.style.width=(mapScale*100)+"%";
    f.nodes.forEach(n=>{ const d=document.createElement("div"); d.className="mdot";
      d.style.top=n.top+"%"; d.style.left=n.left+"%"; d.style.background=isLive(n)?(n.state==="alarm"?"var(--alarm)":"var(--ok)"):"var(--warn)";
      d.addEventListener("click",()=>{ setSub('read'); setTimeout(()=>flash(n.id),60); }); mf.appendChild(d); });
    return;
  }
  const live=f.nodes.filter(isLive), rest=f.nodes.filter(n=>!isLive(n));
  let h='<div class="section-label">Live sensors</div>';
  h+= live.length ? live.map(cardLive).join("") : '<div class="cempty">No sensors configured on this floor yet.</div>';
  if(rest.length){ h+='<div class="section-label">Unassigned rooms</div>'+rest.map(cardRest).join(""); }
  h+='<div class="foot">Add a sensor serial in the config to bring a room live.<br>Auto-refreshes every 2 minutes.</div>';
  main.innerHTML=h;
}
function flash(id){ const f=floorById[current]; const n=f.nodes.find(x=>x.id===id);
  const cards=[...document.querySelectorAll('.card')];
  const t=cards.find(c=>c.querySelector('.cname')&&c.querySelector('.cname').textContent===n.name);
  if(t){ t.scrollIntoView({behavior:"smooth",block:"center"}); t.style.transition="box-shadow .2s";
    t.style.boxShadow="0 0 0 2px var(--accent)"; setTimeout(()=>t.style.boxShadow="",1400); } }

let mapScale=2;
function zoomMap(dir){ mapScale=Math.min(4,Math.max(1,mapScale+dir*0.5));
  const mf=document.getElementById("mfloor"); if(mf) mf.style.width=(mapScale*100)+"%"; }

function setStatus(t){ document.getElementById("status").textContent=t; }
async function refresh(){
  const stations={};
  APP.FLOORS.forEach(f=> f.nodes.forEach(n=>{ if(isLive(n)){ (stations[f.stationSn]=stations[f.stationSn]||[]).push(n); }}));
  if(APP.PROXY_URL.includes("YOUR-WORKER")||!Object.keys(stations).length){ setStatus("no sensors configured"); render(); return; }
  setStatus("updating…");
  const end=new Date(), start=new Date(Date.now()-APP.LOOKBACK_MIN*60000); let anyErr=false;
  for(const [sn,list] of Object.entries(stations)){
    const url=APP.PROXY_URL+"?loggers="+encodeURIComponent(sn)+"&start_date_time="+encodeURIComponent(utcStamp(start))+"&end_date_time="+encodeURIComponent(utcStamp(end));
    try{ const res=await fetch(url); if(!res.ok)throw new Error("HTTP "+res.status);
      const rows=(await res.json()).data||[];
      list.forEach(n=>{ const t=pickLatest(rows,n.sn,n.measurement), rh=pickLatest(rows,n.sn,"RH");
        if(t&&!Number.isNaN(t.value)){ const tF=toF(t); n.state=tF>=n.alarmF?"alarm":(tF>=n.warnF?"warn":"ok");
          n.reading={ok:true,temp:tF,rh:(rh&&!Number.isNaN(rh.value))?rh.value:null,ts:t.ts}; }
        else{ n.state="warn"; n.reading={ok:false,msg:"No recent data"}; } });
    }catch(e){ anyErr=true; list.forEach(n=>{ n.state="warn"; n.reading={ok:false,msg:"Connection error"}; }); }
  }
  setStatus(anyErr?"connection error":"updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));
  document.getElementById("livedot").style.background=anyErr?"var(--alarm)":"var(--ok)";
  render();
}

buildTabs(); selFloor("ALL"); refresh(); setInterval(refresh, APP.REFRESH_MS||120000);
</script>
</body>
</html>
