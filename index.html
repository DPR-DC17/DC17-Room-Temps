<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC17 · Temperature</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#12161d; --panel-2:#1a1f28; --line:#262d38;
    --ink:#e8edf4; --ink-dim:#8b94a3; --accent:#37b0ff;
    --ok:#4fd08a; --warn:#ffcf5c; --alarm:#ff5c5c;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
  header{background:var(--panel);border-bottom:1px solid var(--line);
    padding:11px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand h1{font-size:15px;font-weight:600;letter-spacing:.3px}
  .brand .tag{font-family:var(--mono);font-size:11px;color:var(--ink-dim);
    letter-spacing:1px;text-transform:uppercase}
  .tabs{display:flex;gap:6px;margin-left:6px}
  .tab{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-dim);
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:7px 14px;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--accent);color:#04121d;border-color:var(--accent)}
  .rhead{margin-left:auto;display:flex;align-items:center;gap:14px}
  .status{font-family:var(--mono);font-size:11px;color:var(--ink-dim);display:flex;align-items:center;gap:7px}
  .status .live{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 8px var(--ok);animation:blink 2s infinite}
  @keyframes blink{50%{opacity:.35}}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.5px;background:var(--panel-2);
    color:var(--ink-dim);border:1px solid var(--line);border-radius:6px;padding:7px 12px;
    cursor:pointer;transition:.15s;text-transform:uppercase}
  .btn:hover{color:var(--ink);border-color:#39424f}
  .btn.active{background:#123047;color:var(--accent);border-color:#22597f}
  a.btn{text-decoration:none;display:inline-flex;align-items:center}

  /* ---------- FLOOR VIEW ---------- */
  #view-floor{display:grid;grid-template-columns:1fr 320px;min-height:0}
  .stage{background:radial-gradient(circle at 50% 25%,#11161d 0,#0b0e13 72%);
    display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
  .floorplan{position:relative;height:min(1500px,calc(100vh - 120px));width:auto;
    background-size:contain;background-repeat:no-repeat;background-position:center;
    border:1px solid var(--line);border-radius:6px;box-shadow:0 24px 70px rgba(0,0,0,.6);
    cursor:crosshair}
  .plan-title{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:4;
    pointer-events:none;margin-top:10px;font-size:17px;font-weight:600;letter-spacing:.4px;
    background:rgba(11,14,19,.82);border:1px solid var(--line);border-radius:8px;
    padding:8px 18px;box-shadow:0 6px 20px rgba(0,0,0,.45);white-space:nowrap}

  .node{position:absolute;transform:translate(-50%,-50%);width:4.4%;aspect-ratio:1;
    border-radius:50%;cursor:pointer;z-index:3}
  .node .ring{width:100%;height:100%;border-radius:50%;border:2px solid rgba(255,255,255,.9);
    background:var(--warn);transition:transform .14s;box-shadow:0 0 8px rgba(0,0,0,.55)}
  .node::after{content:"";position:absolute;inset:-2px;border-radius:50%;
    border:2px solid var(--ok);opacity:.4;animation:ping 2.8s ease-out infinite;display:none}
  @keyframes ping{0%{transform:scale(.75);opacity:.5}100%{transform:scale(1.7);opacity:0}}
  .node:hover .ring{transform:scale(1.18)}
  .node.live .ring{background:var(--ok)}
  .node.alarm .ring{background:var(--alarm)}
  .node.live::after{display:block;border-color:var(--ok)}
  .node.live.alarm::after{border-color:var(--alarm)}
  .node.sel .ring{border-color:#fff !important;box-shadow:0 0 16px rgba(255,255,255,.85)}
  .node .badge{position:absolute;top:-6px;right:-6px;width:11px;height:11px;border-radius:50%;
    background:var(--ink-dim);border:2px solid var(--bg);display:none}
  .node.live.stale .badge{display:block}
  .node .tip{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);
    font-family:var(--mono);font-size:10px;white-space:nowrap;background:rgba(11,14,19,.95);
    padding:4px 8px;border-radius:4px;border:1px solid var(--line);opacity:0;
    pointer-events:none;transition:.12s;z-index:6}
  .node:hover .tip{opacity:1}

  aside{background:var(--panel);border-left:1px solid var(--line);padding:18px;
    overflow-y:auto;display:flex;flex-direction:column;gap:18px}
  .ptitle{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:11px}
  .detail{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:17px;min-height:130px}
  .detail .empty{color:var(--ink-dim);font-size:13px;line-height:1.6}
  .dt-head{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .dt-head .dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .dt-name{font-size:17px;font-weight:600}
  .dt-loc{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;
    color:var(--ink-dim);margin-bottom:14px}
  .stat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
    border-bottom:1px solid var(--line);font-size:13px}
  .stat:last-child{border-bottom:none}
  .stat .k{color:var(--ink-dim)} .stat .v{font-family:var(--mono);font-size:13px}
  .v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.alarm{color:var(--alarm)}
  .roster{display:flex;flex-direction:column;gap:6px}
  .rrow{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:7px 9px;
    border:1px solid var(--line);border-radius:7px;cursor:pointer;transition:.12s;color:var(--ink-dim)}
  .rrow:hover{border-color:#39424f;color:var(--ink)}
  .rrow.sel{border-color:#39424f;color:var(--ink);background:var(--panel-2)}
  .rrow .sw{width:9px;height:9px;border-radius:50%;box-shadow:0 0 6px currentColor;flex:none}
  .rrow .id{font-family:var(--mono);margin-left:auto;font-size:10px;opacity:.7}
  .rrow .lv{font-family:var(--mono);font-size:8.5px;letter-spacing:.5px;color:var(--ok);
    border:1px solid #24463a;border-radius:3px;padding:1px 4px;margin-left:auto}
  .coord{font-family:var(--mono);font-size:11px;color:var(--ink-dim);background:var(--panel-2);
    border:1px solid var(--line);border-radius:7px;padding:11px;line-height:1.65}
  .coord b{color:var(--accent)} .coord.hot{border-color:#22597f}

  /* ---------- ALL FLOORS VIEW ---------- */
  #view-all{display:none;overflow-y:auto;padding:22px 26px}
  .floor-section{margin-bottom:26px}
  .floor-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .floor-head h2{font-size:16px;font-weight:600}
  .floor-head .meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--warn)}
  .card.ok::before{background:var(--ok)} .card.alarm::before{background:var(--alarm)}
  .ctop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .cdot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 6px currentColor}
  .card.ok .cdot{background:var(--ok);color:var(--ok)} .card.alarm .cdot{background:var(--alarm);color:var(--alarm)}
  .cname{font-size:14px;font-weight:600}
  .cpill{margin-left:auto;font-family:var(--mono);font-size:8.5px;padding:2px 6px;border-radius:4px;
    border:1px solid var(--line);color:var(--ink-dim)}
  .cpill.live{color:var(--ok);border-color:#24463a} .cpill.alarm{color:var(--alarm);border-color:#5a2a2a}
  .cbig{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1;margin:2px 0 3px}
  .cbig span{font-size:14px;color:var(--ink-dim);font-weight:600;margin-left:2px}
  .cbig.alarm{color:var(--alarm)} .cbig.warn{color:var(--warn)}
  .csub{font-size:12px;color:var(--ink-dim)} .csub b{color:var(--ink);font-weight:600}
  .cempty{color:var(--ink-dim);font-size:13px;padding:6px 2px}
</style>
</head>
<body>
  <header>
    <div class="brand"><h1>DC17 &middot; Temperature</h1><span class="tag" id="subtitle">Level 4</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="rhead">
      <div class="status"><span class="live" id="livedot"></span><span id="status">loading…</span></div>
      <a class="btn" href="mobile.html">&#9634; Mobile</a>
      <button class="btn" id="placeBtn">&#9678; Placement</button>
    </div>
  </header>

  <div id="view-floor">
    <div class="stage"><div class="floorplan" id="floorplan"><div class="plan-title" id="planTitle"></div></div></div>
    <aside>
      <div><div class="ptitle">Selected room</div>
        <div class="detail" id="detail"><div class="empty">Select a room on the plan or from the list.</div></div></div>
      <div><div class="ptitle">Rooms</div><div class="roster" id="roster"></div></div>
      <div><div class="ptitle">Placement helper</div>
        <div class="coord" id="coord">Turn on <b>Placement</b>, then click the plan to read % coordinates.</div></div>
    </aside>
  </div>

  <div id="view-all"></div>

<script>
const APP = {"PROXY_URL": "https://licor-proxy.devinmorell.workers.dev/", "REFRESH_MS": 120000, "LOOKBACK_MIN": 1440, "FLOORS": [{"id": "L4", "name": "Level 4", "image": "floor4.png", "w": 1901, "h": 3406, "stationSn": "22459340", "nodes": [{"id": "4033", "name": "Elec Room S", "loc": "Electrical Room S", "top": 17.5, "left": 73.8, "sn": "22577742", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4032", "name": "Elec Room T", "loc": "Electrical Room T", "top": 26.8, "left": 73.9, "sn": "22577741", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4031", "name": "Elec Room U", "loc": "Electrical Room U", "top": 36.1, "left": 73.9, "sn": "22577740", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4029", "name": "Elec Room V", "loc": "Electrical Room V", "top": 45.3, "left": 73.9, "sn": "22577739", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4028", "name": "Elec Room W", "loc": "Electrical Room W", "top": 54.5, "left": 74.0, "sn": "22443485", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4027", "name": "Elec Room X", "loc": "Electrical Room X", "top": 63.6, "left": 74.0, "sn": "22443487", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "4026", "name": "Elec Room R1", "loc": "Electrical Room R1", "top": 72.7, "left": 73.9, "sn": "22443486", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "EH-3", "name": "Ehouse 3", "loc": "Ehouse 3", "top": 27.1, "left": 94.3, "sn": "", "measurement": "Temperature", "warnF": 80, "alarmF": 90}, {"id": "EH-2", "name": "Ehouse 2", "loc": "Ehouse 2", "top": 36.3, "left": 94.1, "sn": "", "measurement": "Temperature", "warnF": 80, "alarmF": 90}, {"id": "EH-1", "name": "Ehouse 1", "loc": "Ehouse 1", "top": 46.3, "left": 94.2, "sn": "", "measurement": "Temperature", "warnF": 80, "alarmF": 90}, {"id": "4030", "name": "Data Hall 4-F", "loc": "Data Hall \u00b7 Aisle 4-F", "top": 33.8, "left": 33.1, "sn": "22577743", "measurement": "Temperature", "warnF": 80, "alarmF": 97}, {"id": "4020", "name": "Data Hall 4-C", "loc": "Data Hall \u00b7 Aisle 4-C", "top": 61.0, "left": 11.5, "sn": "22577738", "measurement": "Temperature", "warnF": 80, "alarmF": 97}]}, {"id": "L3", "name": "Level 3", "image": "floor3.png", "w": 1901, "h": 3406, "stationSn": "22459340", "nodes": [{"id": "3033", "name": "Elec Room Q", "loc": "Electrical Room Q", "top": 17.5, "left": 73.8, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3032", "name": "Elec Room R2", "loc": "Electrical Room R2", "top": 26.8, "left": 73.9, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3031", "name": "Elec Room P", "loc": "Electrical Room P", "top": 36.1, "left": 73.9, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3029", "name": "Elec Room N", "loc": "Electrical Room N", "top": 45.3, "left": 73.9, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3028", "name": "Elec Room M", "loc": "Electrical Room M", "top": 54.5, "left": 74.0, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3027", "name": "Elec Room L", "loc": "Electrical Room L", "top": 63.6, "left": 74.0, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3026", "name": "Elec Room K", "loc": "Electrical Room K", "top": 72.7, "left": 73.9, "sn": "", "measurement": "Temperature", "warnF": 85, "alarmF": 95}, {"id": "3030", "name": "Data Hall 3-F", "loc": "Data Hall \u00b7 Aisle 3-F", "top": 33.8, "left": 33.1, "sn": "", "measurement": "Temperature", "warnF": 80, "alarmF": 97}, {"id": "3020", "name": "Data Hall 3-C", "loc": "Data Hall \u00b7 Aisle 3-C", "top": 61.0, "left": 11.5, "sn": "", "measurement": "Temperature", "warnF": 80, "alarmF": 97}]}]};

/* ---------- helpers ---------- */
function utcStamp(d){ return d.toISOString().slice(0,19).replace("T"," "); }
function parseTs(t){ return new Date(String(t).replace(" ","T")); }
function relTime(d){ const s=Math.round((Date.now()-d.getTime())/1000);
  if(s<60)return"just now"; if(s<3600)return Math.round(s/60)+" min ago"; return Math.round(s/3600)+" h ago"; }
function pickLatest(rows, sensorSn, measurement){
  const want=(measurement||"Temperature").toLowerCase();
  const match=rows.filter(r=>{ const base=String(r.sensor_sn||"").split("-")[0];
    const type=String(r.sensor_measurement_type||"").toLowerCase();
    return base===String(sensorSn)&&type===want; });
  if(!match.length)return null;
  match.sort((a,b)=>parseTs(b.timestamp)-parseTs(a.timestamp));
  const r=match[0];
  return { value:Number(r.value), unit:r.unit||"", ts:parseTs(r.timestamp) };
}
function toF(reading){ const u=(reading.unit||"").toUpperCase();
  return (u.includes("C")&&!u.includes("F")) ? reading.value*9/5+32 : reading.value; }
function isLive(n){ return !!(n.sn && String(n.sn).trim()); }
function dotColor(n){ if(!isLive(n))return"var(--warn)"; return n.state==="alarm"?"var(--alarm)":"var(--ok)"; }

const floorById={}; APP.FLOORS.forEach(f=>{floorById[f.id]=f;});
let current = APP.FLOORS[0].id;
let selNodeId = null;

/* ---------- tabs ---------- */
function buildTabs(){
  const t=document.getElementById("tabs");
  let h='<div class="tab" data-f="ALL" onclick="selectView(\'ALL\')">All Floors</div>';
  APP.FLOORS.forEach(f=> h+='<div class="tab" data-f="'+f.id+'" onclick="selectView(\''+f.id+'\')">'+f.name+'</div>');
  t.innerHTML=h; markTab();
}
function markTab(){ document.querySelectorAll(".tab").forEach(el=>
  el.classList.toggle("active", el.dataset.f===current)); }

function selectView(id){
  current=id; markTab();
  const floorView=document.getElementById("view-floor"), allView=document.getElementById("view-all");
  const placeBtn=document.getElementById("placeBtn");
  if(id==="ALL"){ floorView.style.display="none"; allView.style.display="block";
    placeBtn.style.display="none"; document.getElementById("subtitle").textContent="All Floors";
    renderAll(); }
  else{ allView.style.display="none"; floorView.style.display="grid";
    placeBtn.style.display=""; document.getElementById("subtitle").textContent=floorById[id].name;
    renderFloor(id); }
}

/* ---------- floor (map) view ---------- */
const fp=document.getElementById("floorplan");
function renderFloor(id){
  const f=floorById[id];
  fp.style.aspectRatio=f.w+" / "+f.h;
  fp.style.backgroundImage="url('"+f.image+"')";
  document.getElementById("planTitle").textContent=f.name+" Temperature Readings";
  fp.querySelectorAll(".node").forEach(n=>n.remove());
  const roster=document.getElementById("roster"); roster.innerHTML="";
  document.getElementById("detail").innerHTML='<div class="empty">Select a room on the plan or from the list.</div>';
  selNodeId=null;
  f.nodes.forEach(n=>{
    const live=isLive(n);
    const el=document.createElement("div");
    el.className="node"+(live?" live":"")+(live&&n.state==="alarm"?" alarm":"");
    el.style.top=n.top+"%"; el.style.left=n.left+"%";
    el.innerHTML='<div class="ring"></div><div class="badge"></div><span class="tip">'+n.name+'</span>';
    el.addEventListener("click",e=>{e.stopPropagation();selectNode(id,n.id);});
    fp.appendChild(el); n._el=el;
    const r=document.createElement("div"); r.className="rrow";
    r.innerHTML='<span class="sw" style="color:'+dotColor(n)+'"></span>'+n.name
      +(live?'<span class="lv">LIVE</span>':'<span class="id">'+n.id+'</span>');
    r.addEventListener("click",()=>selectNode(id,n.id));
    roster.appendChild(r); n._row=r;
  });
}
function selectNode(floorId,nodeId){
  const f=floorById[floorId]; const n=f.nodes.find(x=>x.id===nodeId); if(!n)return;
  selNodeId=nodeId;
  f.nodes.forEach(x=>{x._el&&x._el.classList.remove("sel");x._row&&x._row.classList.remove("sel");});
  n._el&&n._el.classList.add("sel"); n._row&&n._row.classList.add("sel");
  const col=dotColor(n); let rows;
  if(!isLive(n)){
    rows='<div class="stat"><span class="k">Status</span><span class="v">No sensor assigned</span></div>'
        +'<div class="stat"><span class="k">To connect</span><span class="v" style="font-size:11px">add serial in config</span></div>';
  }else if(n.reading&&n.reading.ok){
    const cls=n.state==="alarm"?"alarm":(n.state==="warn"?"warn":"ok");
    rows='<div class="stat"><span class="k">Status</span><span class="v ok">Online</span></div>'
      +'<div class="stat"><span class="k">Temp</span><span class="v '+cls+'">'+n.reading.temp.toFixed(1)+' \u00b0F</span></div>'
      +'<div class="stat"><span class="k">Humidity</span><span class="v">'+(n.reading.rh!=null?n.reading.rh.toFixed(0)+' %RH':'\u2014')+'</span></div>'
      +'<div class="stat"><span class="k">Last upload</span><span class="v">'+relTime(n.reading.ts)+'</span></div>';
  }else{
    rows='<div class="stat"><span class="k">Status</span><span class="v warn">'+((n.reading&&n.reading.msg)||'Waiting…')+'</span></div>';
  }
  document.getElementById("detail").innerHTML=
    '<div class="dt-head"><span class="dot" style="color:'+col+';background:'+col+'"></span>'
    +'<span class="dt-name">'+n.name+'</span></div><div class="dt-loc">'+n.id+' &middot; '+n.loc+'</div>'+rows;
}

/* ---------- all floors view ---------- */
function renderAll(){
  let h="";
  APP.FLOORS.forEach(f=>{
    const live=f.nodes.filter(isLive);
    h+='<div class="floor-section"><div class="floor-head"><h2>'+f.name+'</h2>'
      +'<span class="meta">'+live.length+' of '+f.nodes.length+' rooms with sensors</span></div>';
    if(!live.length){ h+='<div class="cempty">No sensors configured on this floor yet.</div></div>'; return; }
    h+='<div class="grid">';
    live.forEach(n=>{
      const cls=(n.reading&&n.reading.ok)?(n.state==="alarm"?"alarm":(n.state==="warn"?"warn":"ok")):"";
      let big,sub,pill;
      if(n.reading&&n.reading.ok){
        big='<div class="cbig '+(cls==="ok"?"":cls)+'">'+n.reading.temp.toFixed(1)+'<span>°F</span></div>';
        sub='<div class="csub">Humidity <b>'+(n.reading.rh!=null?n.reading.rh.toFixed(0)+'%RH':'—')+'</b> · '+relTime(n.reading.ts)+'</div>';
        pill=n.state==="alarm"?'<span class="cpill alarm">ALARM</span>':'<span class="cpill live">LIVE</span>';
      }else{ big='<div class="cbig" style="color:var(--ink-dim)">—</div>';
        sub='<div class="csub">'+((n.reading&&n.reading.msg)||'Waiting…')+'</div>'; pill='<span class="cpill">—</span>'; }
      h+='<div class="card '+cls+'"><div class="ctop"><span class="cdot"></span><span class="cname">'
        +n.name+'</span>'+pill+'</div>'+big+sub+'</div>';
    });
    h+='</div></div>';
  });
  document.getElementById("view-all").innerHTML=h;
}

/* ---------- fetch (per station, shared across floors) ---------- */
function setStatus(t){ document.getElementById("status").textContent=t; }
async function refresh(){
  const stations={};
  APP.FLOORS.forEach(f=> f.nodes.forEach(n=>{ if(isLive(n)){ (stations[f.stationSn]=stations[f.stationSn]||[]).push(n); }}));
  if(APP.PROXY_URL.includes("YOUR-WORKER")||!Object.keys(stations).length){ setStatus("no sensors configured"); rerender(); return; }
  setStatus("updating…");
  const end=new Date(), start=new Date(Date.now()-APP.LOOKBACK_MIN*60000);
  let anyErr=false;
  for(const [sn,list] of Object.entries(stations)){
    const url=APP.PROXY_URL+"?loggers="+encodeURIComponent(sn)
      +"&start_date_time="+encodeURIComponent(utcStamp(start))
      +"&end_date_time="+encodeURIComponent(utcStamp(end));
    try{
      const res=await fetch(url); if(!res.ok) throw new Error("HTTP "+res.status);
      const rows=(await res.json()).data||[];
      list.forEach(n=>{
        const t=pickLatest(rows,n.sn,n.measurement), rh=pickLatest(rows,n.sn,"RH");
        if(t&&!Number.isNaN(t.value)){ const tF=toF(t);
          n.state=tF>=n.alarmF?"alarm":(tF>=n.warnF?"warn":"ok");
          n.reading={ok:true,temp:tF,rh:(rh&&!Number.isNaN(rh.value))?rh.value:null,ts:t.ts};
          n._el&&n._el.classList.remove("stale");
        }else{ n.state="warn"; n.reading={ok:false,msg:"No recent data"}; n._el&&n._el.classList.add("stale"); }
      });
    }catch(err){ anyErr=true; list.forEach(n=>{ n.state="warn"; n.reading={ok:false,msg:"Connection error"}; n._el&&n._el.classList.add("stale"); }); }
  }
  setStatus(anyErr?"connection error":"updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));
  document.getElementById("livedot").style.background=anyErr?"var(--alarm)":"var(--ok)";
  rerender();
}
function rerender(){
  if(current==="ALL") renderAll();
  else { // update classes/colors on current floor without rebuilding
    const f=floorById[current];
    f.nodes.forEach(n=>{ if(!n._el)return;
      n._el.classList.toggle("alarm", isLive(n)&&n.state==="alarm");
      const sw=n._row&&n._row.querySelector(".sw"); if(sw) sw.style.color=dotColor(n); });
    if(selNodeId) selectNode(current,selNodeId);
  }
}

/* ---------- placement helper ---------- */
const placeBtn=document.getElementById("placeBtn"),coord=document.getElementById("coord");
let placing=false;
placeBtn.addEventListener("click",()=>{placing=!placing;
  placeBtn.classList.toggle("active",placing);coord.classList.toggle("hot",placing);
  if(!placing)coord.innerHTML='Turn on <b>Placement</b>, then click the plan to read % coordinates.';});
fp.addEventListener("click",e=>{ if(!placing)return;
  const r=fp.getBoundingClientRect();
  const left=((e.clientX-r.left)/r.width*100).toFixed(1);
  const top=((e.clientY-r.top)/r.height*100).toFixed(1);
  coord.innerHTML='top: <b>'+top+'</b>%  &middot;  left: <b>'+left+'</b>%<br><br>Put in that room:<br><b>top:'+top+', left:'+left+'</b>';});

/* ---------- init ---------- */
buildTabs();
selectView(current);
refresh();
setInterval(refresh, APP.REFRESH_MS||120000);
</script>
